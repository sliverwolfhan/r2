# 锚点对应表
#
# 每个锚点需要两组坐标：
#   map: 该点在目标 map 坐标系下的真值（卷尺/全站仪/CAD 量得，单位 m）
#   lio: 该点在 Point-LIO 输出 PCD 里的坐标（CloudCompare 点选，或 pcl_viewer 中按 Shift+左键拾取）
#
# 至少 3 个锚点（不共线），4 个以上可做最小二乘更稳。
# 锚点尽量分散在场地四角，覆盖范围越大，远处对齐误差越小。

anchors:
  - name: corner_A
    map: [3.2, 1.2, 0.4]
    lio: [3.596241, -1.427076, 0.457318]

  - name: corner_B
    map: [3.2, 4.8, 0.4]
    lio: [3.516376, -5.060117, 0.533561]

  - name: corner_C
    map: [5.6, 3.6, 0.6]
    lio: [5.937232, -3.831886, 0.0387513]

  - name: corner_D
    map: [8.0, 1.2, 0.2]
    lio: [8.423901, -1.499489, 0.791162]

  - name: corner_E
    map: [8.0, 4.8, 0.2]
