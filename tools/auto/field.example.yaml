# ============================================================
# 矩形墙自动对齐配置 —— 给 auto_align_walls.py 用(梅花桩兜底)。
# 仅在梅花桩被严重遮挡、扫不全时用。优先用 auto_align_blocks.py。
#
# 这套参数是"map 系定义"和"扫描设置",填一次就不动。
# ============================================================

field:
  # 矩形真实长边 / 短边(米),按你的场地实测填
  length: 15.0
  width:  8.0
  # 矩形中心在 map 系的坐标(米)
  # 以"红方右下角 / 蓝方左下角"为原点时,中心通常是 [L/2, W/2] 或类似
  center_map: [7.5, 4.0]
  # 矩形长边相对 map +x 轴的夹角(弧度)。长边沿 +x 时填 0
  yaw_map: 0.0

# 墙体点高度区间(雷达系 z,米):滤掉地面/顶部噪声,留下竖墙
# Point-LIO 是重力对齐的,所以雷达系 z ~= map 系 z(差一个小的地面偏移)
wall_z: [0.3, 2.0]

# 地面在 map 系的 z(米),一般 0
ground_z_map: 0.0

# 建图开机时机器人在 map 系的大致起姿 [x, y, yaw(rad)]
# 用途:打破矩形的 4 个 90° 对称。LIO 原点(0,0,facing +x)经过 4 个候选变换后
# 落点 + 朝向应与这个起姿最接近的那个被选中。
# 要求:停在"明确指向某个角"的位置,别正好停场地正中或朝对角线 —— 那样 4 个
# 候选打分接近,脚本会告警(symmetry not broken)。
start_pose_map: [0.0, 0.0, 0.0]

# 默认建图区(red / blue)。命令行 --zone 可覆盖。
# 红蓝镜像:蓝区 = 红区 center_map.y、yaw_map、start_pose y/yaw 取反
# (长宽/墙高/x/ground_z 不变)。
default_zone: red
