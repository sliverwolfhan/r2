# ============================================================
# 梅花桩自动对齐配置 —— 给 auto_align_blocks.py 用。
# 用 12 个方块(4×3,高度各异)做基准,把现场新建的雷达系 PCD 自动对齐到
# 你的 map 系,不用 CloudCompare 点锚点。
#
# 为什么用方块:12 个方块高度图案完全不对称 → 朝向唯一确定;方块的 map 坐标
# 本身就定义了原点 → 对齐后原点 / 方向自动正确,正好是你要的
# 「红方右下角 / 蓝方左下角」那套 map 系。
#
# 方块真值不在这里填 —— 直接读你现成的权威表(每个坐标都是「手动锚点对齐
# 出来的 map 系下方块中心」,自动法即用这套真值复现同一 map 基准):
#   红区: src/action/at_r2_bt/yaml/block_red.yaml
#   蓝区: src/action/at_r2_bt/yaml/block_blue.yaml   (= red 的 y 取反)
# 本文件只放"检测参数"和"建图起姿"。
# ============================================================

# 权威方块表路径(相对本文件目录)。脚本按 --zone / default_zone 选用。
blocks_red:  ../../src/action/at_r2_bt/yaml/block_red.yaml
blocks_blue: ../../src/action/at_r2_bt/yaml/block_blue.yaml

# 默认建图区(red / blue)。命令行 --zone 可覆盖。
default_zone: blue

# --- 建图开机时雷达原点在 map 系的 6D 起姿 -----------------------------------
# 格式: [x, y, z, roll, pitch, yaw]   单位: 米 / 弧度
# 这是"名义变换 T0":把雷达系点云先摆到 map 系附近,方块就落在真值窗里。
#
# 各分量怎么填:
#   x, y    : 雷达开机那一刻,雷达自身在 map 系的位置(看你停在哪)
#   z       : 雷达离地面的高度。Point-LIO 的 z=0 在雷达本体,而 map 系 z=0 在地面,
#             所以这里填**雷达的实际安装高度**(机械装配尺寸量出来)。
#   roll    : 绕 X 翻转(常见: 0 = 正装;π ≈ 3.14159 = 雷达 z 朝下倒装)
#   pitch   : 绕 Y 倾斜(0 = 水平)
#   yaw     : 绕 Z(车头朝向)。0 = 朝 +x,π/2 ≈ 1.5708 = 朝 +y
#
# 现场起姿能控到 ±0.2m/±10° 就够。每次停同一固定起点最稳。
# 红蓝镜像:蓝区把 y、yaw、roll(z 朝向不变时不动)按物理实际填。
#
# 例子:雷达正装,装在机器人 0.45m 高度,开机停在 map 原点朝 +x
#       → [0.0, 0.0, 0.45, 0.0, 0.0, 0.0]
# 例子:雷达倒装(z 朝下),装在 0.50m 高度,开机停在 (1.0, 2.0) 朝 +y
#       → [1.0, 2.0, 0.50, 3.14159, 0.0, 1.5708]
start_pose_map: [0.0, 0.0, 0.0, 3.14159, 0.0, 0.0]

# --- 检测参数(一般保持默认) ------------------------------------------
# 方块是 1.2m 边对边拼接的阶梯地形:先用 12 格高度图案粗对齐(定朝向、破 90°),
# 再用相邻不同高度块之间的台阶棱精修到厘米级。
cell_radius:    0.25   # 阶段1:在每个格心 ±cell_radius(m) 内采样 median z 当该格高度
edge_halfwin:   0.15   # 阶段2:收窗终值,沿棱法向 ±edge_halfwin(m) 内找 z 突变
                       #        (脚本先用 0.55→0.35→0.20 宽窗把平移拉到位,最后收到此值)
edge_band:      0.30   # 阶段2:沿棱切向取 ±edge_band(m) 宽的条带做中值剖面
height_tol:     0.12   # 阶段1高度残差 > 此值 → 图案不匹配,报错(选错区/差 90°/起姿太偏)
converge_rms:   0.03   # 阶段2棱拟合 RMS > 此值 → 判定未收敛,拒绝出图
search_xy:      0.6    # 阶段1搜索范围:平移 ±search_xy(m)。放宽到 0.6 表示
                       #   start_pose 的 xy 容差 ±60cm。再大会更慢(O(N²))。
search_yaw_deg: 25.0   # 阶段1搜索范围:朝向 ±search_yaw_deg(度)。放宽到 25°
                       #   表示 yaw 容差 ±25°。
z_search_band:  5.0    # 阶段0:z 自动修正搜索下界 -z_search_band(m),上界
                       #   固定 +0.15(在最矮方块 0.2m 之下,防把方块当地面)。
                       #   等价于 start_pose[2] 容差 ±z_search_band m(只往下)。
