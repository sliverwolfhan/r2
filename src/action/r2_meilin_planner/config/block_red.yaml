# R2 梅林任务的方块表（map 系，单位米）
#   - x, y: 方块中心
#   - height: 方块顶面相对地面的高度
#   - cube_x, cube_y: 方块上物块（KFS）在 map 下的位置（按现场实测调整）
#     注：0 和 13 是入口/出口 strip，没有物块；省略 cube_x/cube_y 字段。
# 节点 1..12 是赛场上的 12 个方块（4 行 × 3 列，每格 1.2 × 1.2 m）；
# 0 = 入口虚拟节点（strip x∈[2.0, 3.2], y∈[-4.8, -1.2]）；
# 13 = 出口虚拟节点（strip x∈[8.0, 9.2], y∈[-4.8, -1.2]，与 0 镜像）。

