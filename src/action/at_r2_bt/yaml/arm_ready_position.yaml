# ===== 行为树 MoveBetweenBlocks 并行预备使用的 5 个命名位姿 =====
# SelectArmPrepName 节点会按下一步 PICK 的 (方向, 高度差) 自动选名字，
# ArmMoveNamed 节点根据这里的 6 关节角发送 ArmTask(task_id=1)。
# 关节值占位为现有 ready 位姿，请按实际机械臂校验后替换。
arm_positions:
  pick_front_up400:   [1.900, -0.400, 1.600, 0.450, 0.310, 0.000]
  pick_front_up200:   [1.900, -0.500, 1.700, 0.400, 0.350, 0.000]
  pick_front_down200: [1.900, -1.300, 1.400, 1.000, 0.350, 0.000]
  pick_left_up200:    [0.000, -0.300, 2.098, 0.701, 0.031, 0.000]
  pick_left_down200:  [0.000, -1.200, 2.000, 1.550, 0.000, 0.000]
  ready: [1.562, 0.345, 2.800, 0.363, 0.004, 0.000]
  # ===== 物块搬运的固定动作（ArmMoveNamed 调用，task_id=1） =====
  # 关节值暂用 ready 位姿占位，请按实际机械臂校验后替换。
  lift_block:         [1.600, 0.000, 1.300, -1.300, 0.000, 0.000]  # 抬起物块（抓到后把块举离台面）
  stow_block:         [3.050, 0.000, 1.300, -1.300, 0.000, 0.000]  # 收起物块（把块收回到机身/行进姿态）
  place_block:        [3.050, -0.050, 1.700, -1.550, 0.000, 0.000]  # 放下物块（一般放置点）
  hold_block:         [1.563, 0.719, 2.084, 0.500, 0.031, 0.000]  # 拿着物块（行进/待命时夹持保持的姿态）

  # ===== 放 5 块到九宫格的机械臂位置（place_grid_1 ~ place_grid_5） =====
  place_grid_1:       [1.902, -0.686, -1.100, 0.518, -0.350, 0.000]
  place_grid_2:       [1.902, -0.686, -1.100, 0.518, -0.350, 0.000]
  place_grid_3:       [1.902, -0.686, -1.100, 0.518, -0.350, 0.000]
  place_grid_4:       [1.902, -0.686, -1.100, 0.518, -0.350, 0.000]
  place_grid_5:       [1.902, -0.686, -1.100, 0.518, -0.350, 0.000]
  place_grid_6:       [1.902, -0.686, -1.100, 0.518, -0.350, 0.000]

  push_finish:        [1.902, -0.686, -1.100, 0.518, -0.350, 0.000] 