simple_bt_runner:
  ros__parameters:
    # 当前只抓优先级最高的一个，也就是列表第一个。
    # 后续如果需要“第一个不在就抓下一个”，可以继续复用这个列表。
    weapon_priority:
      - weapon_1
      - weapon_2
      - weapon_3
      - weapon_4
      - weapon_5
      - weapon_6

    # 每个武器头只配置原始语义值：准备位姿、准备位姿容忍度、激光目标距离。
    # GraspReadyByPoseDistance 节点内部会根据 target + tolerance 计算范围。
    weapon_1.grasp_prep_x: 0.90
    weapon_1.grasp_prep_y: 5.49
    weapon_1.grasp_prep_yaw: -3.14
    weapon_1.grasp_prep_y_tolerance: 0.08
    weapon_1.grasp_prep_yaw_tolerance: 0.20
    weapon_1.laser_target_distance: 0.605
    weapon_1.laser_distance_tolerance: 0.005

    weapon_2.grasp_prep_x: 0.00
