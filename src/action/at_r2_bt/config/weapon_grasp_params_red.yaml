simple_bt_runner:
  ros__parameters:
    # ===== 连续抓取(grasp_head_2.xml)循环控制 =====
    # grasp_count: 抓几个(Repeat 循环次数)
    # grasp_start: 从第几个武器开始(1-based, 对应 weapon_priority 第几个)
    # 例: start=1 count=2 -> 抓 weapon_1、weapon_2; start=4 count=3 -> 抓 weapon_4/5/6
    grasp_count: 1
    grasp_start: 1

    # 当前只抓优先级最高的一个，也就是列表第一个。
    # 后续如果需要“第一个不在就抓下一个”，可以继续复用这个列表。
    weapon_priority:
      - weapon_2
      - weapon_3
      - weapon_1
      - weapon_4
      - weapon_5
      - weapon_6

    # 每个武器头只配置原始语义值：准备位姿、准备位姿容忍度、激光目标距离。
    # GraspReadyByPoseDistance 节点内部会根据 target + tolerance 计算范围。
    weapon_1.grasp_prep_x: 0.700
    weapon_1.grasp_prep_y: 5.35
    weapon_1.grasp_prep_yaw: 3.14
    weapon_1.grasp_prep_y_tolerance: 0.08
    weapon_1.grasp_prep_yaw_tolerance: 0.10
    weapon_1.laser_target_distance: 0.360
    weapon_1.laser_distance_tolerance: 0.005

    weapon_2.grasp_prep_x: 0.90
    weapon_2.grasp_prep_y: 5.35
    weapon_2.grasp_prep_yaw: 3.14
    weapon_2.grasp_prep_y_tolerance: 0.08
    weapon_2.grasp_prep_yaw_tolerance: 0.1
    weapon_2.laser_target_distance: 0.560
    weapon_2.laser_distance_tolerance: 0.005

    weapon_3.grasp_prep_x: 1.10
    weapon_3.grasp_prep_y: 5.35
    weapon_3.grasp_prep_yaw: 3.14
    weapon_3.grasp_prep_y_tolerance: 0.08
    weapon_3.grasp_prep_yaw_tolerance: 0.1
    weapon_3.laser_target_distance: 0.760
    weapon_3.laser_distance_tolerance: 0.005

    weapon_4.grasp_prep_x: 0.00
    weapon_4.grasp_prep_y: 0.00
    weapon_4.grasp_prep_yaw: 0.00
    weapon_4.grasp_prep_y_tolerance: 0.02
    weapon_4.grasp_prep_yaw_tolerance: 0.20
    weapon_4.laser_target_distance: 0.
    weapon_4.laser_distance_tolerance: 0.005

    weapon_5.grasp_prep_x: 0.00
    weapon_5.grasp_prep_y: 0.00
    weapon_5.grasp_prep_yaw: 0.00
    weapon_5.grasp_prep_y_tolerance: 0.02
    weapon_5.grasp_prep_yaw_tolerance: 0.20
    weapon_5.laser_target_distance: 0.600
    weapon_5.laser_distance_tolerance: 0.005

    weapon_6.grasp_prep_x: 0.00
    weapon_6.grasp_prep_y: 0.00
    weapon_6.grasp_prep_yaw: 0.00
    weapon_6.grasp_prep_y_tolerance: 0.02
    weapon_6.grasp_prep_yaw_tolerance: 0.20
    weapon_6.laser_target_distance: 0.600
    weapon_6.laser_distance_tolerance: 0.005
