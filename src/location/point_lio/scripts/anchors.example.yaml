# 锚点对应表
#
# 每个锚点需要两组坐标：
#   map: 该点在目标 map 坐标系下的真值（卷尺/全站仪/CAD 量得，单位 m）
#   lio: 该点在 Point-LIO 输出 PCD 里的坐标（CloudCompare 点选，或 pcl_viewer 中按 Shift+左键拾取）
#
# 至少 3 个锚点（不共线），4 个以上可做最小二乘更稳。
# 锚点尽量分散在场地四角，覆盖范围越大，远处对齐误差越小。

anchors:
  - name: corner_A
    map: [0.000, 0.000, 0.000]
    lio: [1.235, -0.412, 0.057]

  - name: corner_B
    map: [10.000, 0.000, 0.000]
    lio: [11.218, -0.689, 0.043]

  - name: corner_C
    map: [10.000, 6.000, 0.000]
    lio: [11.341, 5.601, 0.061]

  - name: corner_D
    map: [0.000, 6.000, 0.000]
    lio: [1.298, 5.879, 0.052]
